name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (the first release is always v0.1.0)
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun scripts/release.ts
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
