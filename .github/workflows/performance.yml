name: Linux performance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/herdr-performance-cache
          key: linux-fixture-v6.12-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            linux-fixture-v6.12-${{ runner.os }}-
      - run: bun run performance
        env:
          PERF_CACHE_DIR: ${{ runner.temp }}/herdr-performance-cache
          PERF_REPORT: ${{ runner.temp }}/performance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-performance
          path: ${{ runner.temp }}/performance.json
          if-no-files-found: error
